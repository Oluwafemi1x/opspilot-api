[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opspilot-api"
version = "0.1.0"
description = "Production-style multi-tenant operations platform built with FastAPI and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.43,<3.0",
  "psycopg[binary]>=3.2.9,<4.0",
  "alembic>=1.16.5,<2.0",
  "pydantic-settings>=2.10.1,<3.0",
  "pyjwt>=2.10.1,<3.0",
  "argon2-cffi>=25.1.0,<26.0",
  "email-validator>=2.2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.1,<9.0",
  "pytest-cov>=6.2.1,<7.0",
  "httpx>=0.28.1,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing"

[tool.hatch.build.targets.wheel]
packages = ["app"]
