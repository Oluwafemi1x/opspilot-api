services:
  - type: web
    name: opspilot-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_ENV
        value: production

databases:
  - name: opspilot-db
    plan: free
    databaseName: opspilot
    user: opspilot
