services:
  - type: web
    name: opspilot-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -e . && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opspilot-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: production

databases:
  - name: opspilot-postgres
    plan: free
    region: frankfurt
    databaseName: opspilot_postgres_mnlg
    user: opspilot_postgres_mnlg_user
    postgresMajorVersion: 16
